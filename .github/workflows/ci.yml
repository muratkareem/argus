name: ARGUS verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: argus_ci_only
          POSTGRES_DB: argus_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run python -m compileall -q backend scripts
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          ARGUS_TEST_DATABASE_URL: postgresql+psycopg://postgres:argus_ci_only@localhost:5432/argus_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen
      - run: PYTHONPATH=backend uv run python scripts/bootstrap.py
      - run: npm ci
        working-directory: frontend
      - name: Verify image-provided Chrome
        run: google-chrome --version
      - run: npm run test:e2e
        working-directory: frontend
        env:
          ARGUS_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            frontend/test-results
            docs/screenshots
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: argus_ci_only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: |
          curl --fail http://127.0.0.1:8080/ -o /dev/null
          curl --fail http://127.0.0.1:8080/api/v1/health
          python - <<'PY'
          import json, urllib.request
          base = 'http://127.0.0.1:8080/api/v1/'
          health = json.load(urllib.request.urlopen(base + 'health'))
          overview = json.load(urllib.request.urlopen(base + 'overview'))
          assert health['database'] == 'postgresql'
          assert overview['total'] == 600 and overview['scored'] == 600
          print('Compose PostgreSQL + API + frontend + ML smoke passed')
          PY
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
