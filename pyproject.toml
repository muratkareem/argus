[project]
name = "argus-fraud"
version = "0.1.0"
description = "Reproducible fraud detection and investigation research workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "xgboost>=3,<4", "shap>=0.48,<1", "joblib>=1.4,<2", "httpx>=0.28,<1"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
